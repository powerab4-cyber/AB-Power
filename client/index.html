<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AB Power — بناء العضلات، زيادة الوزن، إنقاص الوزن" />
    <title>AB Power</title>
    <link rel="preload" as="image" type="image/webp" href="/images/gym.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #0a0a10;
        transition: opacity 0.3s ease;
      }
      #app-splash.app-splash--hide {
        opacity: 0;
      }
      #app-splash::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(147, 71, 209, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(147, 71, 209, 0.055) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      #app-splash::after {
        content: '';
        position: absolute;
        top: -6rem;
        left: 25%;
        width: 24rem;
        height: 24rem;
        border-radius: 9999px;
        background: rgba(147, 71, 209, 0.25);
        filter: blur(64px);
        animation: splash-pulse 5s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 0.7;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes splash-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      .splash-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 1.5rem;
        animation: splash-float 6s ease-in-out infinite;
      }
      .splash-logo {
        width: auto;
        height: 8rem;
        object-fit: contain;
      }
      @media (min-width: 640px) {
        .splash-logo {
          height: 10rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash">
      <div class="splash-inner">
        <img class="splash-logo" src="/logo.png" alt="" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
